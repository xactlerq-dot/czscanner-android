name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1.4
        with:
          command: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          path: bin/*.apk
