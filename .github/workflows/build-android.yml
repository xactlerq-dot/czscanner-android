name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git build-essential libffi-dev libssl-dev wget unzip

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install --upgrade cython
          pip install buildozer
          # 🔍 Проверим, где оказался buildozer
          which buildozer
          buildozer --version

      - name: Download and set up Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
          unzip commandlinetools-linux-6858069_latest.zip
          rm commandlinetools-linux-6858069_latest.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          rm -rf cmdline-tools/latest/cmdline-tools

          # 🔗 Создаём symlink для совместимости
          mkdir -p tools/bin
          ln -s $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager

      - name: Accept licenses and install SDK packages
        run: |
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --install "platform-tools" "build-tools;30.0.3" "platforms;android-30"
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses

      - name: Build APK with retry and full PATH
        run: |
          echo "🔍 PATH:"
          echo $PATH
          echo "🔍 Where is buildozer?"
          which buildozer || find /opt/hostedtoolcache/Python -name buildozer -type f -executable 2>/dev/null
          echo "🔍 Git:"
          which git
          echo "🔍 SDK tools:"
          ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/

          # ✅ Используем полный путь к buildozer, если нужно
          PYTHON_PATH="/opt/hostedtoolcache/Python/3.9.25/x64/bin"
          if [ -f "$PYTHON_PATH/buildozer" ]; then
            echo "✅ Нашли buildozer, запускаем..."
            "$PYTHON_PATH/buildozer" -v android debug
          else
            echo "❌ buildozer не найден в $PYTHON_PATH"
            exit 1
          fi
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r28c
          ANDROIDAPI: 30
          ANDROIDMINAPI: 21
          PATH: /opt/hostedtoolcache/Python/3.9.25/x64/bin:/opt/hostedtoolcache/Python/3.9.25/x64:/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8.0.502-7/x64/bin:${{ github.workspace }}/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:${{ github.workspace }}/.buildozer/android/platform/android-sdk/platform-tools:/usr/bin:$PATH

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
          if-no-files-found: error
