name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git build-essential libffi-dev libssl-dev wget unzip

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install --upgrade cython
          pip install buildozer
          which buildozer
          buildozer --version

      - name: Create .buildozer directory
        run: |
          mkdir -p ~/.buildozer/android/platform

      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: android-sdk-${{ hashFiles('**/buildozer.spec') }}

      - name: Download and set up Android SDK (if not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd ~/.buildozer/android/platform
          wget https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
          unzip commandlinetools-linux-6858069_latest.zip -d android-sdk
          rm commandlinetools-linux-6858069_latest.zip

          mkdir -p android-sdk/cmdline-tools/latest
          mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          rm -rf android-sdk/cmdline-tools/latest/cmdline-tools

          # 🔗 Создаём symlink для совместимости
          mkdir -p android-sdk/tools/bin
          ln -s $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager android-sdk/tools/bin/sdkmanager

      - name: Accept licenses and install SDK packages
        run: |
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --install "platform-tools" "build-tools;30.0.3" "platforms;android-30"
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses

      - name: Cache Python-for-Android packages
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/packages
          key: p4a-packages-${{ hashFiles('**/buildozer.spec') }}

      - name: Build APK with retry and fallback
        run: |
          export PATH="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$HOME/.buildozer/android/platform/android-sdk/platform-tools:/opt/hostedtoolcache/Python/3.9.25/x64/bin:$PATH"
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r28c"
          export ANDROIDAPI="30"
          export ANDROIDMINAPI="21"

          echo "🔍 PATH: $PATH"
          echo "🔍 Which buildozer?" $(which buildozer)
          echo "🔍 Buildozer version:" $(buildozer --version)
          echo "🔍 SDK tools:"
          ls -la $ANDROIDSDK/tools/bin/

          # 🔁 Повторяем сборку до 3 раз
          for i in {1..3}; do
            echo "🔄 Попытка сборки №$i"
            if buildozer -v android debug; then
              echo "✅ Сборка успешна"
              break
            else
              echo "❌ Ошибка сборки, ждём 30 секунд..."
              sleep 30
            fi
          done

          # Проверим, создался ли APK
          if [ ! -f bin/*.apk ]; then
            echo "❌ Сборка не удалась после 3 попыток"
            exit 1
          fi
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r28c
          ANDROIDAPI: 30
          ANDROIDMINAPI: 21
          PATH: /opt/hostedtoolcache/Python/3.9.25/x64/bin:/opt/hostedtoolcache/Python/3.9.25/x64:/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8.0.502-7/x64/bin:${{ github.workspace }}/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:${{ github.workspace }}/.buildozer/android/platform/android-sdk/platform-tools:/usr/bin:$PATH

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
          if-no-files-found: error
