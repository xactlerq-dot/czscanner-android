name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip openjdk-8-jdk libffi-dev libssl-dev

      - name: Upgrade pip and install Cython + Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython
          pip install buildozer

      - name: Initialize Buildozer
        run: |
          buildozer init
          # Если buildozer.spec уже есть — он не перезапишется

      - name: Build Android APK in debug mode
        run: |
          buildozer -v android debug
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r19c
          ANDROIDAPI: 28
          ANDROIDMINAPI: 21

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
          if-no-files-found: error
