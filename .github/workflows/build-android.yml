name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git libffi-dev libssl-dev

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install --upgrade cython
          pip install buildozer

      - name: Download and set up Android SDK (cmdline-tools)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
          unzip commandlinetools-linux-6858069_latest.zip
          rm commandlinetools-linux-6858069_latest.zip

          # Создаём нужную структуру папок
          mkdir -p cmdline-tools/latest
          # Перемещаем всё содержимое в latest, кроме самой папки cmdline-tools
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          # Убираем возможный конфликт
          rm -rf cmdline-tools/latest/cmdline-tools

      - name: Accept licenses and install SDK packages
        run: |
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk --install "platform-tools" "build-tools;30.0.3" "platforms;android-30"
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk --licenses

      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          # Указываем правильный путь к SDK
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r19c
          ANDROIDAPI: 30
          ANDROIDMINAPI: 21
          # Критично: Buildozer будет искать sdkmanager здесь
          PATH: ${{ github.workspace }}/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:${{ github.workspace }}/.buildozer/android/platform/android-sdk/platform-tools:$PATH

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
          if-no-files-found: error
