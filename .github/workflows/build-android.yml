name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git openjdk-8-jdk libffi-dev libssl-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install --upgrade cython
          pip install buildozer

      - name: Create dirs and download Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip

      - name: Accept licenses and install SDK tools
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk --install "platform-tools" "build-tools;30.0.3" "platforms;android-30" "cmdline-tools;latest"
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk --licenses

      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r19c
          ANDROIDAPI: 30
          ANDROIDMINAPI: 21
          JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
          if-no-files-found: error
